<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fun-Guy — Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="globeViz"></div>

  <div class="overlay">
    <p class="status" id="status">connecting…</p>
    <p class="stage" id="stage">Dormant</p>
    <div class="healthBar">
      <div class="healthBarFill" id="healthBarFill"></div>
    </div>
    <div class="actionFeed" id="actionFeed"></div>
    <p class="healthCount" id="healthCount">0 messages received</p>
  </div>

  <!-- Testing only — shown when the URL has ?debug, hidden otherwise
       (never appears on the real kiosk display). Scrubs healthValue
       directly to preview the Dormant -> Thriving transition without
       sending real Ably messages. -->
  <div class="debugPanel" id="debugPanel" hidden>
    <label for="debugSlider">debug: messages received (<span id="debugSliderValue">0</span>)</label>
    <input type="range" id="debugSlider" min="0" max="50" value="0" step="1" />
  </div>

  <!-- Scrolling one-liner cycling through the Q&A pairs, one at a time. -->
  <div class="qaBanner" id="qaBanner">
    <div class="qaBannerTrack" id="qaBannerTrack"></div>
  </div>

  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <script src="//unpkg.com/globe.gl"></script>
  <script src="script.js"></script>
</body>
</html>
