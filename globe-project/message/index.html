<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Talk to the Fun-Guy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <p class="status" id="status">connecting…</p>

    <h1>What do you want to ask the mycelium?</h1>

    <form id="messageForm">
      <textarea
        id="messageInput"
        maxlength="280"
        placeholder="Type your message to the fun-guy…"
        required
      ></textarea>
      <button type="submit" id="sendBtn">Send to the mycelium</button>
    </form>

    <p class="feedback" id="feedback" aria-live="polite"></p>
  </main>

  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <script src="../shared/config.js"></script>
  <script src="script.js"></script>
</body>
</html>
