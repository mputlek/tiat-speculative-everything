<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fun-Guy — Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="globeViz"></div>

  <div class="overlay">
    <p class="status" id="status">connecting…</p>
    <p class="stage" id="stage">Dormant</p>
    <div class="healthBar">
      <div class="healthBarFill" id="healthBarFill"></div>
    </div>
    <p class="healthCount" id="healthCount">0 messages received</p>
  </div>

  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <!-- Pinned: recent three.js releases dropped the classic global/UMD
       build (three.min.js) in favor of ES modules only. Pinning to a
       version that still ships it avoids needing <script type="module">
       just to get a THREE global for the custom clouds layer below. -->
  <script src="//unpkg.com/three@0.155.0/build/three.min.js"></script>
  <script src="//unpkg.com/globe.gl"></script>
  <script src="../shared/config.js"></script>
  <script src="script.js"></script>
</body>
</html>
